<!DOCTYPE html>
<html>
<head>
    <title>Text Change Page</title>
</head>
<body>

    <h1>Simple Text Changer</h1>

    <p id="message">Click the button to change this text.</p>
    <button onclick="changeText()">Change Text</button>

    <hr>

    <!-- Text input feature -->
    <div>
        <label>Enter something:</label>
        <input type="text" id="userInput">
        <button onclick="showInput()">Show Input</button>
        <p id="inputDisplay"></p>
    </div>

    <hr>

    <!-- List feature -->
    <h2>Favorite Fruits</h2>
    <ul id="fruitList">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>
    <button onclick="addFruit()">Add Fruit</button>

    <script>
        function changeText() {
            var text = document.getElementById("message");
            text.innerHTML = "The text has been changed!";
        }

        function showInput() {
            var input = document.getElementById("userInput").value;
            var output = document.getElementById("inputDisplay");

            if (input == "") {
                output.innerHTML = "You did not type anything.";
            } else {
                output.innerHTML = "You typed: " + input;
            }
        }

        function addFruit() {
            var list = document.getElementById("fruitList");
            var item = document.createElement("li");
            item.innerHTML = "New Fruit";
            list.appendChild(item);
        }
    </script>

</body>
</html>
